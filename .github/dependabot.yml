# weekly bumps. prefixes keep the pr titles and commits conventional (commits.yml)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # llegan por sync desde wasichai/wasichai-sync: sus versiones se suben allá, una vez para todos los repos
    exclude-paths:
      - .github/workflows/commits.yml
      - .github/workflows/release-please.yml
      - .github/workflows/secretos.yml
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

name: Publish

on:
  release:
    types: [published]
  # release-dev.yml passes the version of the dev tag it runs for
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # the guard runs before the upload: a failed guard blocks it, so a release never half-publishes
  guards:
    name: Release guard (npm)
    # release-dev.yml uploads dev builds itself: a prerelease must not upload again
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # a release carries it in its tag; a caller must pass it. no fallback: a caller's ref name is no release tag
          if [ "$GITHUB_EVENT_NAME" = release ]; then version="${GITHUB_REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          if [ -z "$version" ]; then
            echo "::error::publish.yml needs inputs.version when called (event $GITHUB_EVENT_NAME)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: yarn
      - run: yarn install --frozen-lockfile && yarn build
      - name: Release guard (npm)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node tooling/check-release.mjs --pack "$VERSION"

  npm:
    name: npm packages
    needs: guards
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # job level, not only on the publish step: setup-node writes an .npmrc that reads ${NODE_AUTH_TOKEN} and, with
    # cache: yarn, runs yarn right away. yarn 1 aborts on an unset variable in .npmrc
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: yarn
          registry-url: https://npm.pkg.github.com
          # the scope must equal the organization: github packages refuses any other
          scope: '@wasichai'
      - run: yarn install --frozen-lockfile && yarn build
      - name: Publish every public @wasichai package
        env:
          # the one the guard checked
          VERSION: ${{ needs.guards.outputs.version }}
        run: |
          # dev versions go under the dev dist-tag so latest never moves; throws on any other prerelease
          tag="$(node tooling/dev-release.mjs dist-tag "$VERSION")"
          # bumps every package's own version AND internal @wasichai/* dep ranges; plain
          # `npm version` per package would leave internal deps pointing at the old version.
          node tooling/set-version.mjs "$VERSION"
          # skips versions already up, so re-running a failed upload finishes it; puts latest back if a dev publish moved it
          node tooling/publish-packages.mjs "$VERSION" "$tag"
